<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="rl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161c2b"/>
      <stop offset="1" stop-color="#07090e"/>
    </linearGradient>
    <radialGradient id="rl-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2f8cff" stop-opacity=".7"/>
      <stop offset=".55" stop-color="#2f8cff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rl-crack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd4ff"/>
      <stop offset=".5" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#7cc4ff"/>
    </linearGradient>
    <filter id="rl-blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#rl-bg)"/>
  <ellipse class="rl-halo" cx="32" cy="32" rx="20" ry="27" fill="url(#rl-halo)"/>
  <g class="rl-rift">
    <!-- halo flou de la faille -->
    <path d="M33 6 L37 17 L34 22.5 L39.5 32 L35 37.5 L37.5 47 L32 58 L28.5 47.5 L31 41 L25 31.5 L29.5 25 L26.5 15.5 Z" fill="#2f8cff" filter="url(#rl-blur)" opacity=".9"/>
    <!-- faille -->
    <path d="M33 6 L37 17 L34 22.5 L39.5 32 L35 37.5 L37.5 47 L32 58 L28.5 47.5 L31 41 L25 31.5 L29.5 25 L26.5 15.5 Z" fill="url(#rl-crack)"/>
    <!-- coeur lumineux -->
    <path class="rl-core" d="M32.8 11 L34.6 17.5 L32.6 22.8 L35.8 32 L33 37.6 L34.4 46.5 L32 53 L30.6 46.8 L31.9 41 L28.6 31.6 L31.2 25 L30 16.5 Z" fill="#ffffff"/>
  </g>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#2f8cff" stroke-opacity=".35" stroke-width="1.5"/>
</svg>
